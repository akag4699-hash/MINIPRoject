<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Aura -->
  <circle cx="100" cy="110" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Ashoka Chakra (Wheel of Law) at the bottom pedestal -->
  <g transform="translate(100, 180)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    <!-- 24 Spokes -->
    <path d="M0,-16 L0,16 M-16,0 L16,0 M-11,-11 L11,11 M-11,11 L11,-11" stroke="#38bdf8" stroke-width="1.2"/>
    <path d="M-6,-15 L6,15 M-15,-6 L15,6 M-15,6 L15,-6 M-6,15 L6,-15" stroke="#38bdf8" stroke-width="0.8" opacity="0.8"/>
    
    <!-- Base Platform -->
    <path d="M-60,20 L60,20 L50,28 L-50,28 Z" fill="url(#goldGrad)"/>
    <rect x="-70" y="28" width="140" height="5" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Center Lion (Front Facing) -->
  <g fill="url(#goldGrad)" stroke="#664d03" stroke-width="0.5">
    <!-- Mane -->
    <path d="M100,25 C80,25 65,45 65,75 C65,105 75,130 90,140 L110,140 C125,130 135,105 135,75 C135,45 120,25 100,25 Z"/>
    <!-- Face Contour -->
    <path d="M82,55 C82,50 90,45 100,45 C110,45 118,50 118,55 C122,65 120,85 100,95 C80,85 78,65 82,55 Z" fill="#ffd700"/>
    <!-- Snout & Whisker Pads -->
    <ellipse cx="94" cy="78" rx="6" ry="4" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="106" cy="78" rx="6" ry="4" fill="#ffffff" opacity="0.9"/>
    <polygon points="98,72 102,72 100,76" fill="#1e293b"/>
    <!-- Eyes -->
    <ellipse cx="90" cy="62" rx="3.5" ry="2" fill="#1e293b"/>
    <ellipse cx="110" cy="62" rx="3.5" ry="2" fill="#1e293b"/>
    <!-- Brow & Crown -->
    <path d="M85,52 Q100,46 115,52" fill="none" stroke="#aa7c11" stroke-width="2"/>
    <circle cx="100" cy="38" r="4" fill="#ffd700" stroke="#aa7c11"/>
  </g>

  <!-- Left Lion (Profile Facing Left) -->
  <g fill="url(#goldGrad)" stroke="#664d03" stroke-width="0.5" opacity="0.95">
    <path d="M68,55 C55,58 45,72 45,95 C45,115 55,130 70,140 L80,135 C70,120 62,100 62,80 C62,68 65,60 68,55 Z"/>
    <ellipse cx="48" cy="80" rx="3" ry="2" fill="#1e293b"/>
  </g>

  <!-- Right Lion (Profile Facing Right) -->
  <g fill="url(#goldGrad)" stroke="#664d03" stroke-width="0.5" opacity="0.95">
    <path d="M132,55 C145,58 155,72 155,95 C155,115 145,130 130,140 L120,135 C130,120 138,100 138,80 C138,68 135,60 132,55 Z"/>
    <ellipse cx="152" cy="80" rx="3" ry="2" fill="#1e293b"/>
  </g>

  <!-- Pedestal Galloping Horse (Left) & Bull (Right) -->
  <text x="52" y="185" font-family="sans-serif" font-size="12" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">♞</text>
  <text x="148" y="185" font-family="sans-serif" font-size="12" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">♉</text>

  <!-- National Motto: SATYAMEVA JAYATE in Devanagari & English -->
  <text x="100" y="224" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#f8fafc" letter-spacing="1.5" text-anchor="middle">सत्यमेव जयते</text>
  <text x="100" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#94a3b8" letter-spacing="2" text-anchor="middle">GOVERNMENT OF INDIA</text>
</svg>
